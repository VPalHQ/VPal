/* Layout: phone-first app. Sticky header + tab bar, one view at a time. Single dark night-sky look on purpose (matches a Palworld night sky). */
:root{
  --bg:#0b1220; --panel:#111a2c; --panel-2:#16213a; --line:#26324d;
  --fg:#eef2f8; --muted:#a3b0c6; --soft:#c7d0de; --accent:#f5c04e; --accent-ink:#0b1220; --blue:#6ea8ff; --bad:#ff9b8f;
  --ocean:#041b3f;
  --font-display:'Space Grotesk', Inter, system-ui, sans-serif;
  --font-body:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand h1{margin:0;font-family:var(--font-display);font-size:18px;font-weight:600;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:1 0 auto;text-align:center;min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;border:1px solid transparent}
nav.tabs a[hidden]{display:none}
.homebtn{min-height:40px;min-width:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.overlay{position:fixed;inset:0;background:rgba(5,9,18,.72);display:flex;align-items:flex-end;justify-content:center;z-index:2000;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.sheet ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;color:var(--soft);font-size:14px;line-height:1.45}
@media (min-width:700px){.overlay{align-items:center}}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--panel-2);border-color:var(--line)}
main{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.small{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=search],select{height:44px;box-sizing:border-box;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;min-width:0}
select.big{border-color:var(--accent);font-weight:600;width:100%}
input::placeholder{color:#8c99b3}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border-color:transparent;min-height:36px;padding:0 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--panel-2);border-color:var(--accent);color:var(--accent)}
.chip .dot{width:13px;height:13px;border-radius:50%;border:2px solid #0b1220;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.chip .n{font-size:11px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.gold{background:rgba(245,192,78,.07);border-color:rgba(245,192,78,.5)}
.card.blue{background:rgba(110,168,255,.08);border-color:rgba(110,168,255,.45)}
.kicker{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.dot-on{width:8px;height:8px;border-radius:50%;background:#3ddc84;display:inline-block}
.meta{font-size:13px;color:var(--soft);line-height:1.45}
.muted{color:var(--muted)}

          <div class="brand">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z" fill="#f5c04e"></path></svg>
            <h1 data-site-title>Pal Planner</h1>

          <div class="who"><span class="name" id="who"></span><button class="btn ghost homebtn" type="button" data-homehelp="1" aria-label="Add to Home Screen" title="Add to Home Screen"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button class="btn ghost" id="lockbtn" type="button">Lock</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';
const $ = (s, r=document)=>r.querySelector(s);
const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v)=>Math.round(v);
const ELC = {Fire:'#F28A5B',Water:'#5AAEF5',Grass:'#74C977',Electric:'#F2D35A',Ground:'#C79A62',Ice:'#9BDDF2',Dragon:'#B08CF5',Dark:'#8B7BD8',Neutral:'#CFC8B8'};
const ivColor = (v)=> v>=90?'#f5c04e':(v>=70?'#6ea8ff':'#55617c');
const ivText = (v)=> v>=90?'#f5c04e':(v>=70?'#6ea8ff':'#a3b0c6');
// The page's name, who to ask for a code and a few server rules (site.json, written by the planner on the server PC).
let SITE = {name:'', owner:'', eggHours:null};
function siteTitle(){ return SITE.name ? SITE.name + ' Pal Planner' : 'Pal Planner'; }
function askOwner(){ return SITE.owner ? 'Ask ' + SITE.owner : 'Ask the server owner'; }
function eggLine(){
  const h = SITE.eggHours;
  if (h===null || h===undefined || isNaN(h)) return '';
  const where = SITE.name ? 'On ' + esc(SITE.name) : 'On this server';
  if (h <= 0) return `<li><b>${where},</b> eggs hatch instantly.</li>`;
  return `<li><b>${where},</b> the biggest eggs take ${Math.round(h*10)/10} hours to hatch, and smaller eggs less.</li>`;
}
function applySite(){
  document.title = siteTitle();
  document.querySelectorAll('[data-site-title]').forEach(e=>{ e.textContent = siteTitle(); });
  const m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (m) m.content = SITE.name ? SITE.name + ' Pals' : 'Pal Planner';
  const a = document.getElementById('askowner'); if (a) a.textContent = `Don't have a code? ${askOwner()}.`;
  const mv = document.getElementById('mainview'); if (mv && !mv.hidden && typeof route==='function') route();
}
fetch('site.json', {cache:'no-store'}).then(r=>r.ok ? r.json() : null).then(j=>{ if (j && typeof j==='object'){ SITE = Object.assign(SITE, j); applySite(); } }).catch(()=>{});

const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

let D = null;      // this player's data
let MAPD = null;   // public map data
let PALS = [];     // D.pals by index
const ui = { palFilter:'all', palSort:'atk', palQuery:'', palShown:30, open:-1, job:'mining', boss:null, hard:false,
  atkCat:null, arenaRank:null, atkOrder:(store.get('vega-atk-order')==='az'?'az':'lv'), atkQ:'', atkPick:{},
  schView:'place', schCat:'all', schQ:'', schStatus:'missing', schShown:40, schOpen:{}, schHideCovered:true,
  baseView:'bases', baseSel:null, baseJob:'Mining', baseHideAtBase:false, baseQ:'', baseShown:20, baseWhere:'all', baseOrder:'best',
  az:{}, lvb:{}, recCat:'all', recStatus:'have', recQ:'', recShown:30, recOpen:null };
let SCH = null;    // public schematic data (same for everyone)
let REC = null;    // public recipe data (same for everyone), loaded the first time someone opens Recipes
// true values (IVs) only show for players who own Ability Glasses or Pal Tamer's Glasses; older planners without this info keep showing them
const seeTrue = ()=> !D || !D.glasses || !!D.glasses.has;
const num = (v)=> v==null ? '–' : Number(v).toLocaleString('en-US');
let mapRegion = 'main';   // 'main' islands or the 'tree' (World Tree)
let mapFocus = null;      // set by a "Show on map" button: {pal, map, gx, gy}
const REG = (r)=> (r||mapRegion)==='tree' ? (MAPD && MAPD.tree || {pts:{},pals:{},bounds:[[0,0],[1,1]]}) : MAPD;
const RIMG = {main:'relief.webp', tree:'tree.webp'};
const RNAME = {main:'Main islands', tree:'World Tree'};

// ---------- unlock ----------
const b64 = (s)=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function tryUnlock(code){
  code = code.trim().toLowerCase();
  if (!code) return false;
  if (!(window.crypto && crypto.subtle)) throw new Error('This browser can’t unlock the planner. Try Chrome, Safari or Edge.');
  const enc = await (await fetch('planners.enc.json', {cache:'no-store'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  for (const e of enc.entries){
    try {
      const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.salt), iterations:enc.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.ct));
      const ds = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
      D = JSON.parse(await new Response(ds).text());
      UNLOCK_CODE = code;
      return true;
    } catch(err){ /* wrong code for this entry */ }
  }
  return false;
}
async function onUnlock(ev){
  if (ev) ev.preventDefault();
  const code = $('#code').value; $('#err').textContent = ''; $('#unlock').disabled = true; $('#unlock').textContent = 'Unlocking…';
  try {
    const ok = await tryUnlock(code);
    if (!ok){ $('#err').textContent = 'That code didn’t match. Check the spelling, including the dashes.'; return; }
    if ($('#remember').checked) store.set('vega-code', code.trim().toLowerCase()); else store.del('vega-code');
    start();
  } catch(err){ $('#err').textContent = err.message || 'Something went wrong. Reload the page and try again.'; }
  finally { $('#unlock').disabled = false; $('#unlock').textContent = 'Unlock'; }
}
$('#lockform').addEventListener('submit', onUnlock);
$('#lockbtn').addEventListener('click', ()=>{ store.del('vega-code'); location.hash=''; location.reload(); });

// ---------- Add to Home Screen ----------
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); installEvt = e; });
const isStandalone = ()=> (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = ()=> /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
if (isStandalone()) document.querySelectorAll('[data-homehelp]').forEach(b=>b.hidden=true);
function showHomeHelp(){
  const ios = isIOS(), android = /android/i.test(navigator.userAgent);
  const steps = ios ? ['Make sure this page is open in Safari. If you opened the link inside Messages or another app, tap the compass or “Open in Safari” button first.',
                       'Tap the Share button (the square with an arrow pointing up).',
                       'Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.',
                       'Open the planner from the new star icon and enter your code one more time. After that it remembers you.']
    : android ? ['Make sure this page is open in Chrome.',
                 'Tap the 3-dot menu at the top right.',
                 'Tap <b>Add to Home screen</b> or <b>Install app</b>, then <b>Add</b>.',
                 'Open the planner from the new star icon. Your code is remembered.']
    : ['On a phone, open this same link and tap this button again for the steps.',
       'On a computer, press Ctrl+D (Cmd+D on a Mac) to bookmark it, or use the install icon at the right end of the address bar in Chrome or Edge.'];
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hhT">
    <div class="head"><h3 id="hhT">Put the planner on your home screen</h3><button class="btn ghost" type="button" data-close>Close</button></div>
    <p class="meta" style="margin:0">It gets its own star icon and opens full screen, like an app.</p>
    ${installEvt?`<button class="btn primary" type="button" data-install>Add it now</button><p class="meta" style="margin:0">Or do it by hand:</p>`:''}
    <ol>${steps.map(t=>`<li>${t}</li>`).join('')}</ol></div>`;
  document.body.appendChild(ov);
  const close = ()=>{ ov.remove(); document.removeEventListener('keydown', esc1); };
  const esc1 = (e)=>{ if (e.key==='Escape') close(); };
  document.addEventListener('keydown', esc1);
  ov.addEventListener('click', (e)=>{ if (e.target===ov || e.target.closest('[data-close]')) close(); });
  const ib = ov.querySelector('[data-install]');
  if (ib) ib.addEventListener('click', async ()=>{ try { installEvt.prompt(); await installEvt.userChoice; } catch(e){} installEvt = null; close(); });
  ov.querySelector('[data-close]').focus();
}
document.addEventListener('click', (e)=>{ if (e.target.closest('[data-homehelp]')) showHomeHelp(); });

// Asks once, on a phone, whether to put the planner on the home screen. Yes adds it (Android: the browser's own
// install box; iPhone: Apple only allows it by hand, so the steps show). Yes or no, it never asks again.
function askHomeOnce(){
  const phone = isIOS() || /android/i.test(navigator.userAgent);
  if (!phone || isStandalone() || store.get('vega-home-asked')) return;
  store.set('vega-home-asked', new Date().toISOString());
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="haT">
    <h3 id="haT">Add the Pal Planner to your home screen?</h3>

// Once per device: an invite to the family's Discord (as soon as the server owner has one set up). Yes or no, it never asks again.
async function askDiscordOnce(tries){
  tries = tries || 0;
  if (store.get('vega-discord-asked')) return;
  if (document.querySelector('.overlay')){ if (tries < 60) setTimeout(()=>askDiscordOnce(tries+1), 3000); return; }   // the home screen question is open
  let v; try { const r = await fetch('voice', {headers:{'X-Planner-Code':UNLOCK_CODE}, cache:'no-store'}); if (!r.ok) return; v = await r.json(); } catch(e){ return; }
  VOICE = v;
  if (!v || !v.invite || store.get('vega-discord-asked') || document.querySelector('.overlay')) return;
  store.set('vega-discord-asked', new Date().toISOString());
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dcT">
    <h3 id="dcT">Join our Discord?</h3>
    <p class="meta" style="margin:0">That’s where we talk while we play${v.server?`: <b>${esc(v.server)}</b>`:''}. Once you’re in, the Voice tab gets you into the voice channel with one tap. You’ll only be asked this once.</p>
    <div class="row"><a class="btn primary" href="${esc(v.invite)}" target="_blank" rel="noopener" data-yes style="flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none">Yes, join</a><button class="btn" type="button" data-no style="flex:1">No thanks</button></div></div>`;
  document.body.appendChild(ov);
  const close = ()=>ov.remove();
  ov.querySelector('[data-no]').addEventListener('click', close);
  ov.querySelector('[data-yes]').addEventListener('click', ()=>setTimeout(close, 50));
  ov.querySelector('[data-yes]').focus();
}

// ---------- A–Z letter picker and level bands (keep long lists short) ----------
const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
function azOf(s){ const c = String(s||'').trim().charAt(0).toUpperCase(); return c>='A' && c<='Z' ? c : '#'; }
// Shows only the names that start with the chosen letter. Returns {bar, list, letter}. Short lists are left alone.
function azPick(key, list, nameOf, min){
  if (list.length <= (min==null?20:min)) return {bar:'', list, letter:''};
  const have = {}; for (const x of list){ const l=azOf(nameOf(x)); have[l]=(have[l]||0)+1; }
  const letters = AZ.concat(have['#']?['#']:[]);
  let cur = ui.az[key];
  if (!cur || !have[cur]) cur = letters.find(l=>have[l]);
  ui.az[key] = cur;
  const bar = `<div class="azbar" role="group" aria-label="Pick a letter">${letters.map(l=>`<button type="button" class="az" data-az="${esc(key)}" data-l="${l}" ${have[l]?'':'disabled'} aria-pressed="${l===cur}" aria-label="${l==='#'?'Other':l}${have[l]?` (${have[l]})`:''}">${l}</button>`).join('')}</div>`;
  return {bar, list: list.filter(x=>azOf(nameOf(x))===cur), letter: cur, n: have[cur]};
}
// Level bands for lists ordered by level: Lv 1–10, 11–20, …
function lvPick(key, list, lvOf, min){
  if (list.length <= (min==null?20:min)) return {bar:'', list};
  const band = (lv)=>Math.min(9, Math.floor((Math.max(1,lv)-1)/10));
  const have = {}; for (const x of list){ const b=band(lvOf(x)); have[b]=(have[b]||0)+1; }
  let cur = ui.lvb[key];
  if (cur==null || !have[cur]) cur = +Object.keys(have).sort((a,b)=>a-b)[0];
  ui.lvb[key] = cur;
  const bar = `<div class="chips" role="group" aria-label="Level range">${Object.keys(have).map(Number).sort((a,b)=>a-b).map(b=>`<button type="button" class="chip" data-lvb="${esc(key)}" data-b="${b}" aria-pressed="${b===cur}">Lv ${b*10+1}–${b===9?'100':b*10+10} <span class="n">${have[b]}</span></button>`).join('')}</div>`;
  return {bar, list: list.filter(x=>band(lvOf(x))===cur)};
}

// ---------- My Pals ----------
function palMatches(p){
  if (ui.palFilter==='party' && p.kind!=='party') return false;
  if (ui.palFilter==='palbox' && p.kind!=='palbox') return false;
  if (ui.palFilter==='base' && !String(p.kind).startsWith('base')) return false;
  if (ui.palFilter==='alpha' && !p.alpha) return false;
  if (ui.palFilter==='perfect' && seeTrue() && !(p.hp>=90 && p.atk>=90 && p.def>=90)) return false;
  if (ui.palQuery){ const q=ui.palQuery.toLowerCase(); if (!(p.name.toLowerCase().includes(q) || (p.nick||'').toLowerCase().includes(q) || (p.passives||[]).some(x=>x.n.toLowerCase().includes(q)))) return false; }
  return true;
}
function palSorted(list){
  const ws = (p)=>(p.passives||[]).reduce((s,x)=>s+(/Artisan|Remarkable|Serious|Lucky|Work Slave|Conceited/.test(x.n)? (x.n==='Remarkable Craftsmanship'?75:x.n==='Artisan'?50:x.n==='Work Slave'?30:x.n==='Lucky'||x.n==='Serious'?20:10):0),0);
  const g = seeTrue(), st = (p,i)=>-((p.st||[])[i]||0);
  const f = {atk:(p)=>g?-p.atk:st(p,1), hp:(p)=>g?-p.hp:st(p,0), def:(p)=>g?-p.def:st(p,2), total:(p)=>g?-(p.hp+p.atk+p.def):st(p,1),

// ---------- where to catch (from public map data) ----------
function areaGroups(name, r){
  const cells=((REG(r).pals||{})[name]||[]).slice().sort((a,b)=>b[5]-a[5]); const groups=[];
  for (const c of cells){ const g=groups.find(g=>Math.hypot(g.gx-c[0],g.gy-c[1])<70); if(g){ g.n+=c[5]; g.lmin=Math.min(g.lmin,c[2]); g.lmax=Math.max(g.lmax,c[3]); } else groups.push({gx:c[0],gy:c[1],n:c[5],lmin:c[2],lmax:c[3]}); }
  return groups.sort((a,b)=>b.n-a.n);
}
function whereToCatch(name){
  if (!MAPD) return [];
  const out=[]; const R=[['main',''],['tree','World Tree · ']];
  for (const [r,tag] of R) for (const g of areaGroups(name,r).slice(0, Math.max(0,2-out.length))) out.push({kind:'Wild', pal:name, map:r, gx:fmt(g.gx), gy:fmt(g.gy), text:`${tag}(${fmt(g.gx)}, ${fmt(g.gy)}) · Lv ${g.lmin}–${g.lmax} · fast travel: ${nearestFT(g.gx,g.gy,r)}`});
  for (const [r,tag] of R) for (const p of (REG(r).pts.alpha||[])) if (p[2]==='Alpha '+name) out.push({kind:'Alpha', pal:name, map:r, gx:fmt(p[0]), gy:fmt(p[1]), text:`${tag}(${fmt(p[0])}, ${fmt(p[1])}) · ${p[3].split(' · ')[0]} · fast travel: ${nearestFT(p[0],p[1],r)}`});
  return out;
}
function nearestFT(gx,gy,r){ let b=null,d=1e9; for(const p of (REG(r).pts.ft||[])){ const x=Math.hypot(p[0]-gx,p[1]-gy); if(x<d){d=x;b=p;} } return b?b[2]:''; }

// ---------- Attack ----------
const ATK_CATS = [['tower','Towers'],['story','Story bosses'],['arena','Arena'],['raid','Raid bosses'],['alpha','Alpha pals'],['tree','World Tree alphas']];
const ARENA_RANKS = ['Bronze','Silver','Gold','Platinum','Diamond','Master','Legend'];
function atkCat(a){ const g=a.group||''; return g==='Towers'?'tower':g.startsWith('Story')?'story':g.startsWith('Arena')?'arena':g.startsWith('Raid')?'raid':g.startsWith('World Tree')?'tree':'alpha'; }
function arenaRank(a){ const m=/^Arena: (\w+)/.exec(a.group||''); return m?m[1]:''; }
function atkPicker(a){
  const counts={}, ranks={}, rankLv={};
  for (const x of D.attack){ const c=atkCat(x); counts[c]=(counts[c]||0)+1; if (c==='arena'){ const r=arenaRank(x); ranks[r]=(ranks[r]||0)+1; rankLv[r]=x.lv; } }
  const cats = ATK_CATS.filter(([k])=>counts[k]);
  if (!counts[ui.atkCat]) ui.atkCat = a ? atkCat(a) : cats[0][0];
  if (ui.atkCat==='arena' && !ranks[ui.arenaRank]) ui.arenaRank = (a && arenaRank(a)) || ARENA_RANKS.find(r=>ranks[r]);
  const all = D.attack.filter(x=>atkCat(x)===ui.atkCat && (ui.atkCat!=='arena' || arenaRank(x)===ui.arenaRank));
  const big = all.length > 12;
  const q = big ? ui.atkQ.trim().toLowerCase() : '';
  const list0 = all.filter(x=>!q || (x.label+' '+x.pal).toLowerCase().includes(q))
    .sort(ui.atkOrder==='az' ? (x,y)=>x.label.localeCompare(y.label) : (x,y)=>(x.lv-y.lv)||x.label.localeCompare(y.label));
  // long lists: only one letter (A–Z) or one level range (by level) at a time
  const pkey = 'atk:' + ui.atkCat + (ui.atkCat==='arena' ? ':'+ui.arenaRank : '');
  let narrow = {bar:'', list:list0};
  if (big && !q){
    if (ui.atkOrder==='az'){ if (!ui.az[pkey] && a && list0.includes(a)) ui.az[pkey]=azOf(a.label); narrow = azPick(pkey, list0, x=>x.label, 12); }
    else { if (ui.lvb[pkey]==null && a && list0.includes(a)) ui.lvb[pkey]=Math.min(9, Math.floor((Math.max(1,a.lv)-1)/10)); narrow = lvPick(pkey, list0, x=>x.lv, 12); }
  }
  const list = narrow.list;
  if (!a || !all.includes(a)) a = list[0] || all[0];
  else if (list.length && !list.includes(a)) a = list[0];
  ui.boss = a.id; ui.atkPick[ui.atkCat==='arena'?'arena:'+ui.arenaRank:ui.atkCat] = a.id;

function gLetter(r){ return r>=0.9?'A+':r>=0.78?'A':r>=0.66?'B':r>=0.52?'C':r>=0.38?'D':'E'; }
function gClass(r){ return r>=0.78?'gold':r>=0.52?'blue':'bad'; }

function whereNow(p){ return p.where.startsWith('base') ? `Working at ${baseName(p.where)}` : p.loc; }
function jobBadge(p, job){ const j=p.jobs[job]; if(!j) return ''; return `<span class="badge ${gClass(j[1])}">${esc(job)} ${j[0]} · ${gLetter(j[1])}</span>`; }
function gRow(p, job, extra){

}
// what a base can focus on: the jobs it needs (weights), the buildings that mean it, and helper pals worth a slot
const FOCI = [
  {k:'oil', l:'Crude oil', jobs:{'Generating Electricity':6,'Transporting':3}, b:/^OilPump/},
  {k:'mining', l:'Ore and stone', jobs:{'Mining':7,'Transporting':3}, b:/Pit(_\d+)?$/},
  {k:'smelting', l:'Ingots', jobs:{'Kindling':6,'Transporting':3,'Generating Electricity':1}, b:/BlastFurnace/},
  {k:'crafting', l:'Building and crafting', jobs:{'Handiwork':7,'Transporting':2,'Generating Electricity':1}, b:/^(Factory_|WeaponFactory|SphereFactory|AncientWorkBench|WorkBench$)/, extra:[['Sekhmet','makes every Anubis here work faster']]},
  {k:'lumber', l:'Lumber', jobs:{'Lumbering':7,'Transporting':3}, b:/^StationDeforest/},
  {k:'farming', l:'Crops and food', jobs:{'Planting':3,'Watering':3,'Gathering':2,'Kindling':1,'Cooling':1}, b:/^(FarmBlock|FlourMill|.*Kitchen|CookingStove)/, extra:[['LeafPrincess','crops grow faster'],['BlueberryFairy','bigger harvests']]},
  {k:'ranch', l:'Ranch', jobs:{'Farming':8,'Transporting':2}, b:/^MonsterFarm$/},
  {k:'breeding', l:'Breeding and eggs', jobs:{'Farming':2,'Planting':1,'Watering':1,'Gathering':1,'Kindling':1}, b:/^(BreedFarm|HatchingPalEgg)/, extra:[['Plesiosaur','Breeding Farm makes eggs faster'],['ThunderFluffyBird','eggs hatch faster']]},
  {k:'medicine', l:'Medicine', jobs:{'Medicine Production':6,'Transporting':2,'Generating Electricity':1}, b:/^MedicineFacility/},
];
function focusKey(b){ return 'vega-focus-'+D.player+'-'+b.key; }
function detectFocus(b){ return FOCI.filter(f=>Object.keys(b.build||{}).some(id=>f.b.test(id))).map(f=>f.k); }
function getFocus(b){ try{ const v=JSON.parse(store.get(focusKey(b))||'null'); if (Array.isArray(v)) return v.filter(k=>FOCI.some(f=>f.k===k)); }catch(e){} return detectFocus(b); }
function slotsKey(b){ return 'vega-slots-'+D.player+'-'+b.key; }
function getSlots(b){ const v=parseInt(store.get(slotsKey(b))||'',10); return v>0 ? v : (D.base.workerMax || Math.max(b.workers.length, 15)); }
function genCapacity(b){ let n=0; for (const [id,c] of Object.entries(b.build||{})){ const bc=D.base.bcat[id]; if (bc && bc.req.some(r=>r[0]==='Generating Electricity')) n += c*(bc.w||1); } return n; }
function powerDraw(b, foci){ let e=0; for (const [id,c] of Object.entries(b.build||{})){ const bc=D.base.bcat[id]; if (!bc||!bc.e) continue; if (foci.some(k=>FOCI.find(f=>f.k===k).b.test(id))) e += bc.e*c; } return e; }
function planAll(){
  const B=D.base, P=B.pals, used=new Set(), plans={};
  for (const b of B.bases){
    const foci=getFocus(b), slots=getSlots(b);
    const plan={foci, slots, jobs:[], buffs:[], extra:[], notes:[], cap:genCapacity(b), power:powerDraw(b, foci)};
    plans[b.key]=plan;
    if (!foci.length) continue;
    const avail=(i)=> !used.has(i) && (P[i].where===b.key || P[i].where==='palbox' || P[i].where==='party');
    const pick=(list)=> list.filter(avail).sort((x,y)=>(P[y].where===b.key)-(P[x].where===b.key) || P[y].rank-P[x].rank || P[y].lv-P[x].lv)[0];
    const w={};
    for (const k of foci){ const f=FOCI.find(x=>x.k===k), tot=Object.values(f.jobs).reduce((t,c)=>t+c,0); for (const [j,v] of Object.entries(f.jobs)) w[j]=(w[j]||0)+v/tot; }
    const sumw=Object.values(w).reduce((t,c)=>t+c,0);
    const order=Object.keys(w).sort((x,y)=>w[y]-w[x]);
    let left=slots;
    // one base-buff pal for each job that matters here (it takes a worker slot)
    for (const j of order){
      if (w[j]/sumw < 0.15) continue;
      const bf=B.buffs.find(x=>x.job===j); if (!bf) continue;
      const i=pick(bf.have);
      if (i!=null && left>2){ used.add(i); left--; plan.buffs.push({i, bf}); }
      else if (i==null) plan.notes.push(`Catch a ${bf.name}: one living here gives every other pal +1 ${j}.`);
    }
    for (const k of foci) for (const [sid, text] of (FOCI.find(x=>x.k===k).extra||[])){
      if (sid==='Sekhmet' && !P.some((p,i)=>p.species==='Anubis' && (p.where===b.key || avail(i)))) continue;
      const i=pick(P.map((p,i)=>i).filter(i=>P[i].species===sid));
      if (i!=null && left>2){ used.add(i); left--; plan.extra.push({i, text}); }
    }
    // share the remaining slots between the jobs
    const alloc={}; let given=0;
    const raw=order.map(j=>[j, left*w[j]/sumw]);
    raw.forEach(([j,x])=>{ alloc[j]=Math.floor(x); given+=alloc[j]; });
    raw.slice().sort((x,y)=>(y[1]%1)-(x[1]%1)).forEach(([j])=>{ if (given<left){ alloc[j]++; given++; } });
    // power: fill every generator spot when the base runs on electricity, no more
    if (alloc['Generating Electricity']!=null && plan.cap>0){
      const target=Math.min(plan.cap, left-(order.length>1?1:0)), diff=target-alloc['Generating Electricity'];
      const other=order.find(j=>j!=='Generating Electricity');
      alloc['Generating Electricity']=target; if (other) alloc[other]=Math.max(0, alloc[other]-diff);
      if (foci.includes('oil') && left-target>4) plan.notes.push(`You have room for more workers: another Large Power Generator would take 2 more Electric pals and keep the extractors running at full speed.`);
    }
    for (const j of order){
      const n=alloc[j]||0; if (!n) continue;
      const c=P.map((p,i)=>i).filter(i=>avail(i) && P[i].jobs[j]).sort((x,y)=>{
        const a=P[x], d=P[y];
        return (d.jobs[j][0]-a.jobs[j][0]) || ((d.best&&d.best[0]===j)-(a.best&&a.best[0]===j)) || (d.jobs[j][1]-a.jobs[j][1]) || ((d.where===b.key)-(a.where===b.key)) || (d.lv-a.lv);
      }).slice(0,n);
      c.forEach(i=>used.add(i));
      plan.jobs.push({job:j, want:n, pals:c});
    }
  }
  return plans;
}

      <div>${list.slice(0, ui.baseShown).map(p=>gRow(p, p.best[0], p.best2?`next best: ${esc(p.best2[0])} (${gLetter(p.best2[1])})`:'')).join('')}</div></div>
      ${list.length>ui.baseShown?`<button class="btn" id="bmore" type="button">Show more (${list.length-ui.baseShown} left)</button>`:''}`;
  } else if (ui.baseView==='buffs'){
    body = `<div class="card"><div class="head"><div><h3>Base-wide buffs</h3><p class="sub">One of these living at a base helps every pal there. A second copy at the same base does nothing.</p></div></div>
      ${B.buffs.map(bf=>`<div class="goal"><div class="nm">${esc(bf.name)} <span class="muted" style="font-weight:400">${esc(bf.text)}</span></div>
        <p class="meta" style="margin:0">${bf.have.length?`You have ${bf.have.length}. ${bf.at.length?`Working at ${bf.at.map(baseName).join(' and ')}.`:(bf.job?'None at a base yet: move one to the base that does this job.':'None at a base yet: move one to the base where it helps.')}`:'You don’t have one yet.'}</p>${bf.find?whereBlock(bf.find):''}</div>`).join('')}</div>

        <div class="chips">${sy.pals.map(x=>`<span class="badge ${x.have?(x.at.length?'gold':'blue'):'bad'}">${esc(x.name)} · ${x.have?(x.at.length?'at '+x.at.map(baseName).join(', '):'in your Palbox'):'not caught'}</span>`).join('')}</div></div>`).join('')}</div>`;

      ${B.workerMax?`<div class="goal"><div class="nm">Your server allows ${B.workerMax} pals per base</div><p class="meta" style="margin:0">You can change it in the control panel under Base (“Pals per base”, up to 50). More workers means more output, but also more lag.</p></div>`:''}
      <div class="goal"><div class="nm">How the ratings work</div><p class="meta" style="margin:0">A rating is mostly the pal’s real work level against the best level you can reach for that job (usually 10). Work-speed passives, night work and stars nudge it up a little. A+ means Lv 9–10, A is about Lv 8, B Lv 7, C Lv 6 and D Lv 4–5. Lists are ordered by work level first, because in 1.0 a higher level beats a work-speed passive.</p></div></div>`;

// ---------- Schematics ----------
const SCH_CATS = [['all','All'],['Weapons','Weapons'],['Armor','Armor'],['Accessories','Accessories'],['Other','Base items']];
const RAR_C = {Common:'#a3b0c6', Uncommon:'#7ee081', Rare:'#6ea8ff', Epic:'#c792ff', Legendary:'#f5c04e'};
const SCH_GROUP = {ruin:['Ancient ruin towers','Each tower’s hack terminal gives one fixed reward, once. Pins are on the Map tab under “Ruin towers”.'],
  alpha:['Alpha pal drops','About a 3% chance each time you beat, catch or butcher that alpha.'], raid:['Raid bosses','Summon them at a Summoning Altar in your base.'],
  arena:['Arena rewards','Won by clearing that Arena rank.']};
function schName(x){ return x.n + ' Schematic' + (x.t ? ' ' + x.t : ''); }
function schData(){
  const have = D.schem || {}, fam = {}, st = {};
  for (const x of SCH.list){ (fam[x.c+'|'+x.n] ||= []).push(x); }
  const owned = (id)=>{ const h=have[id]||[0,0]; return h[0]+h[1]>0; };
  for (const x of SCH.list){
    const h = have[x.id] || [0,0], own = h[0]+h[1] > 0;
    st[x.id] = {own, bag:h[0], chest:h[1], covered: !own && fam[x.c+'|'+x.n].some(y=>y.t>x.t && owned(y.id))};
  }
  return {st, fam};
}
function placeInfo(k){
  const P = SCH.places[k] || [k, 9, ''];
  const gate = P[2]==='sky' && !(D.access||{}).sky ? 'Opens after you beat the Feybreak Tower' : P[2]==='tree' && !(D.access||{}).tree ? 'Opens after you catch Panthalus' : '';
  const taken = k.startsWith('ruin:') && (D.progress.ruin||[]).includes(k.slice(5));
  return {label:P[0], order:P[1], gate, gx:P[3], gy:P[4], taken};
}
function alphaSpot(pid, label){
  const name = label.replace(/^Alpha /,'');
  for (const r of ['main','tree']) for (const p of (REG(r).pts.alpha||[])) if (p[2]===label) return mapBtn(name, r, fmt(p[0]), fmt(p[1]));
  return '';
}
function srcLine(k, c, note){
  const p = placeInfo(k);
  const chance = c!=null ? ` · up to ${c}%` : '';
  let map = '';
  if (k.startsWith('ruin:') && p.gx!=null) map = ' ' + mapBtn('', 'main', p.gx, p.gy, 'Ancient ruin tower');
  if (k.startsWith('alpha:')) map = ' ' + alphaSpot(k.slice(6), p.label);
  return `<span>${esc(p.label)}${chance}${note?` · ${esc(note)}`:''}${p.taken?' · <b style="color:var(--muted)">you already took it, but it isn’t in your bag or base chests now</b>':''}${p.gate?` · <b style="color:var(--bad)">${esc(p.gate)}</b>`:''}${map}</span>`;
}
function renderSchem(){
  if (!SCH){ $('#view').innerHTML = `<div><h2>Schematics</h2><p class="sub">Loading the schematic list…</p></div>`; return; }
  if (!D.schem){ $('#view').innerHTML = `<div><h2>Schematics</h2><p class="sub">This planner was built before schematics were tracked. ${askOwner()} to click Refresh now.</p></div>`; return; }
  const {st} = schData();
  const q = ui.schQ.trim().toLowerCase();
  const inCat = (x)=> ui.schCat==='all' || x.c===ui.schCat;
  const pool = SCH.list.filter(inCat);
  const total = pool.length, own = pool.filter(x=>st[x.id].own).length;
  const inBag = pool.filter(x=>st[x.id].bag).length, inChest = pool.filter(x=>st[x.id].chest).length;
  const covered = pool.filter(x=>st[x.id].covered).length;
  const missing = pool.filter(x=>!st[x.id].own && !(ui.schHideCovered && st[x.id].covered) && (!q || schName(x).toLowerCase().includes(q)));
  const head = `<div><h2>Schematics</h2><p class="sub">A schematic works while it’s in your bag or in a chest at your guild’s base, so base chests count for everyone in the guild.</p></div>
    <div class="card"><div class="head"><div><h3>You have ${own} of ${total}</h3><p class="sub">${inBag} in your bag · ${inChest} in base chests · ${total-own} missing${covered?` (${covered} of those are lower tiers of ones you already have)`:''}</p></div><div class="rating">${Math.round(own/Math.max(total,1)*100)}%<small>found</small></div></div><div class="prog"><i style="width:${Math.round(own/Math.max(total,1)*100)}%"></i></div></div>
    <div class="chips" role="group" aria-label="View"><button type="button" class="chip" data-sview="place" aria-pressed="${ui.schView==='place'}">Where to find what I’m missing</button><button type="button" class="chip" data-sview="item" aria-pressed="${ui.schView==='item'}">Every schematic</button></div>
    <div class="chips" role="group" aria-label="Kind">${SCH_CATS.map(([k,l])=>`<button type="button" class="chip" data-scat="${k}" aria-pressed="${ui.schCat===k}">${l}</button>`).join('')}</div>
    <div class="row"><input type="search" id="schq" value="${esc(ui.schQ)}" placeholder="Search, e.g. Assault Rifle" aria-label="Search schematics" style="flex:1 1 220px">
      <label class="row" style="gap:8px;font-size:13px;color:var(--soft)"><input type="checkbox" id="schcov" ${ui.schHideCovered?'checked':''} style="width:20px;height:20px;accent-color:#f5c04e"> Hide lower tiers I don’t need</label></div>`;
  let body = '';
  if (ui.schView==='place'){
    const cards = {};
    for (const x of missing) for (const [k,c,note] of x.s){
      const kind = k.split(':')[0];
      const key = SCH_GROUP[kind] ? kind : k;
      (cards[key] ||= {key, kind, items:[]}).items.push({x, k, c, note});
    }
    const list = Object.values(cards).map(cd=>{
      const p = SCH_GROUP[cd.kind] ? {label:SCH_GROUP[cd.kind][0], gate:'', order:0} : placeInfo(cd.key);
      cd.label = p.label; cd.gate = p.gate; cd.why = SCH_GROUP[cd.kind] ? SCH_GROUP[cd.kind][1] : '';
      cd.items.sort((a,b)=>(b.c||101)-(a.c||101) || schName(a.x).localeCompare(schName(b.x)));
      return cd;
    }).sort((a,b)=>(!!a.gate - !!b.gate) || (b.items.length - a.items.length) || a.label.localeCompare(b.label));
    body = list.length ? list.slice(0, ui.schShown).map(cd=>{
      const rar = {}; cd.items.forEach(i=>{ rar[i.x.r]=(rar[i.x.r]||0)+1; });
      const open = !!ui.schOpen[cd.key];
      return `<div class="card"><button type="button" class="schhead" data-sopen="${esc(cd.key)}" aria-expanded="${open}"><div style="flex:1;min-width:0"><h3>${esc(cd.label)}</h3><p class="sub">${cd.items.length} you’re missing${cd.gate?` · <b style="color:var(--bad)">${esc(cd.gate)}</b>`:''}</p></div><span class="muted" aria-hidden="true">${open?'▲':'▼'}</span></button>
        <div class="chips">${['Legendary','Epic','Rare','Uncommon','Common'].filter(r=>rar[r]).map(r=>`<span class="badge" style="color:${RAR_C[r]};border-color:${RAR_C[r]}66">${rar[r]} ${r}</span>`).join('')}</div>
        ${open?`${cd.why?`<p class="meta" style="margin:0">${esc(cd.why)}</p>`:''}<div class="schlist">${cd.items.map(i=>`<div class="schrow"><span class="dot" style="background:${RAR_C[i.x.r]}"></span><div style="flex:1;min-width:0"><div class="nm">${esc(schName(i.x))} <span class="muted" style="font-weight:400">${esc(i.x.r)}</span></div>${SCH_GROUP[cd.kind]?`<div class="meta" style="font-size:12px">${srcLine(i.k,i.c,i.note)}</div>`:(i.c!=null?`<div class="meta" style="font-size:12px">up to ${i.c}% per chest or roll</div>`:(i.note?`<div class="meta" style="font-size:12px">${esc(i.note)}</div>`:''))}</div></div>`).join('')}</div>`:''}
      </div>`; }).join('') + (list.length>ui.schShown?`<button class="btn" id="schmore" type="button">Show more places (${list.length-ui.schShown} left)</button>`:'')
      : `<div class="empty">${q?'Nothing you’re missing matches that search.':'You have every schematic in this group.'}</div>`;
  } else {
    const fams = {};
    for (const x of SCH.list.filter(inCat)) if (!q || schName(x).toLowerCase().includes(q)) (fams[x.c+'|'+x.n] ||= []).push(x);
    const rows0 = Object.entries(fams).sort((a,b)=>a[1][0].n.localeCompare(b[1][0].n));
    const az = q ? {bar:'', list:rows0} : azPick('schem:'+ui.schCat, rows0, r=>r[1][0].n);
    const rows = az.list;
    body = `${az.bar}<div class="list">${rows.slice(0, ui.schShown).map(([k,tiers])=>{
      tiers.sort((a,b)=>a.t-b.t);
      const open = !!ui.schOpen[k];
      const nOwn = tiers.filter(x=>st[x.id].own).length;
      return `<div class="card"><button type="button" class="schhead" data-sopen="${esc(k)}" aria-expanded="${open}"><div style="flex:1;min-width:0"><h3>${esc(tiers[0].n)}</h3><p class="sub">${esc(tiers[0].c==='Other'?'Base item':tiers[0].c.replace(/s$/,''))} · ${nOwn} of ${tiers.length} found${tiers[0].tt?' · Terraria collab':''}</p></div><span class="muted" aria-hidden="true">${open?'▲':'▼'}</span></button>
        <div class="chips">${tiers.map(x=>{ const s=st[x.id]; return `<span class="badge ${s.own?'gold':(s.covered?'':'bad')}" title="${esc(schName(x))}">${x.t?'Tier '+x.t:'Schematic'} · ${esc(x.r)} · ${s.own?(s.bag?'in your bag':'in a base chest')+((s.bag+s.chest)>1?` ×${s.bag+s.chest}`:''):(s.covered?'not needed':'missing')}</span>`; }).join('')}</div>
        ${open?tiers.filter(x=>!st[x.id].own).map(x=>`<div class="goal"><div class="nm" style="color:${RAR_C[x.r]}">${esc(schName(x))} <span class="muted" style="font-weight:400">${esc(x.r)}${st[x.id].covered?' · you already have a better tier':''}</span></div><div class="where">${x.s.slice(0,6).map(([k,c,note])=>`<b>Get</b>${srcLine(k,c,note)}`).join('')}</div></div>`).join('') || (open?'<p class="meta" style="margin:0">You have every tier of this one.</p>':''):''}
      </div>`; }).join('')}</div>${rows.length>ui.schShown?`<button class="btn" id="schmore" type="button">Show more (${rows.length-ui.schShown} left)</button>`:''}`;
  }
  $('#view').innerHTML = head + body + `<p class="foot">Drop chances are per chest, catch or roll, from the Palworld 1.0.5 game tables (Palworld Atlas Data, MIT; Arkive by Yihao Liu, CC BY-NC 4.0). The Drafting Table (Technology 45) turns 5 schematics of one tier into 1 of the next tier.</p>`;
  document.querySelectorAll('[data-sview]').forEach(b=>b.addEventListener('click', ()=>{ ui.schView=b.dataset.sview; ui.schShown=40; renderSchem(); }));
  wireAz(()=>{ ui.schShown=40; renderSchem(); });
  document.querySelectorAll('[data-scat]').forEach(b=>b.addEventListener('click', ()=>{ ui.schCat=b.dataset.scat; ui.schShown=40; renderSchem(); }));
  document.querySelectorAll('[data-sopen]').forEach(b=>b.addEventListener('click', ()=>{ const k=b.dataset.sopen; ui.schOpen[k]=!ui.schOpen[k]; const y=window.scrollY; renderSchem(); window.scrollTo(0,y); }));
  $('#schcov').addEventListener('change', (e)=>{ ui.schHideCovered=e.target.checked; renderSchem(); });
  $('#schq').addEventListener('input', (e)=>{ ui.schQ=e.target.value; ui.schShown=40; const pos=e.target.selectionStart; renderSchem(); const n=$('#schq'); n.focus(); n.setSelectionRange(pos,pos); });
  const more=$('#schmore'); if (more) more.addEventListener('click', ()=>{ const y=window.scrollY; ui.schShown+=40; renderSchem(); window.scrollTo(0,y); });
}

const REC_CATS = [['all','All'],['weapon','Weapons'],['armor','Armor and gliders'],['acc','Accessories'],['sphere','Spheres'],['ammo','Ammo'],['gear','Pal gear'],['food','Food'],['consume','Medicine and items'],['mat','Materials'],['key','Key items'],['schem','Schematic upgrades'],['build','Buildings']];
const RARITY = ['Common','Uncommon','Rare','Epic','Legendary'];
let recCache = null;      // per player: unlock state of every recipe
function recItem(id){ return (REC.items[id]||[id,''])[0]; }
function recIcon(id, name){ const ic=(REC.items[id]||[])[1]; return `<span class="iico" aria-hidden="true">${ic?picImg(REC.art+ic+'.webp'):''}<span>${esc(String(name||recItem(id)).charAt(0))}</span></span>`; }
function techText(id){ const t=REC.techs[id]; if(!t) return 'a Technology'; return `${t[2]?'Ancient Technology':'Technology'} Lv ${t[1]}: ${t[0]} (${t[3]} ${t[2]?'ancient ':''}point${t[3]===1?'':'s'})`; }
function recBuild(){
  const TS = new Set((D.tech||{}).t||[]);
  const stOk = (st)=>{ const u=(REC.stations[st]||[st,[]])[1]; return !u.length || u.some(t=>TS.has(t)); };
  const stLv = (st)=>Math.min(...((REC.stations[st]||[st,[]])[1].map(t=>(REC.techs[t]||[0,99])[1])), 99);
  const schem = D.schem || {};
  const usedIn = {};
  const out = REC.recipes.map((r, idx)=>{
    const need = [], have = [];
    if (r.x) need.push('Not unlocked through the Technology tree (it comes from somewhere else in the game).');
    if (r.t){ if (r.t.some(t=>TS.has(t))) have.push('You unlocked '+techText(r.t.find(t=>TS.has(t)))); else need.push('Unlock '+techText(r.t.slice().sort((a,b)=>(REC.techs[a]||[0,99])[1]-(REC.techs[b]||[0,99])[1])[0])); }
    if (r.s){ const c=schem[r.s]||[0,0]; if (c[0]||c[1]) have.push(`You have the ${recItem(r.s)} (${c[0]?'in your bag':'in a base chest'})`); else need.push(`Find the ${recItem(r.s)}. See the Schematics tab for where it drops.`); }
    let at = [];
    if (r.at){
      at = r.at.filter(stOk);
      if (!at.length){ const cheap = r.at.slice().sort((a,b)=>stLv(a)-stLv(b))[0]; const u=(REC.stations[cheap]||[cheap,[]])[1]; need.push(`Build a ${(REC.stations[cheap]||[cheap])[0]}${u.length?' ('+techText(u[0])+')':''}`); }
    }
    for (const [m] of r.m) (usedIn[m] ||= []).push(idx);
    return {r, ok: !need.length, need, have, at};
  });
  recCache = {key: D.player+'|'+D.saved, list: out, usedIn};
}
function haveOf(id){ const v=(D.inv||{})[id]; return v ? [v[0], v[1]] : [0,0]; }
function matChip(id, n){
  const [b,c] = haveOf(id), t = b+c, inv = !!D.inv;
  const cls = !inv ? '' : (t>=n ? 'ok' : 'short');
  const tip = inv ? `${num(b)} on you · ${num(c)} in base chests` : '';
  return `<button type="button" class="mat ${cls}" data-recq="${esc(recItem(id))}" title="${esc(tip)}">${recIcon(id)}${num(n)} ${esc(recItem(id))}${inv?` <small>have ${num(t)}</small>`:''}</button>`;
}
function recRow(x){
  const r = x.r, open = ui.recOpen===r.id+'|'+r.k;
  const rar = r.r ? RARITY[r.r] : '';
  const where = r.k==='build' ? `Build menu${r.g?' · '+esc(r.g):''}` : (x.at.length ? x.at.map(st=>esc((REC.stations[st]||[st])[0])).join(' · ') : 'Made at: '+r.at.map(st=>esc((REC.stations[st]||[st])[0])).join(' · '));
  const used = (recCache.usedIn[r.id]||[]).slice(0,10).map(i=>recCache.list[i].r);
  return `<div class="rec">
    <button type="button" class="top" data-recopen="${esc(r.id+'|'+r.k)}" aria-expanded="${open}">${recIcon(r.k==='build'?'':r.id, r.n)}<div class="t"><div class="nm" ${rar?`style="color:${RAR_C[rar]}"`:''}>${esc(r.n)}${rar&&rar!=='Common'?` <span class="muted" style="font-weight:500;font-size:12px">${rar}</span>`:''}${r.pc?` <span class="muted" style="font-weight:500;font-size:12px">· makes ${r.pc}</span>`:''}</div><div class="ln">${where}</div></div><span class="muted" aria-hidden="true">${open?'▲':'▼'}</span></button>
    ${x.ok?'':`<div class="meta" style="font-size:12px;color:var(--bad)">${x.need.map(esc).join(' · ')}</div>`}
    <div class="mats">${r.m.map(([id,n])=>matChip(id,n)).join('')}</div>
    ${open?`<div class="recdetail">
      ${x.have.map(t=>`<div>✓ ${esc(t)}</div>`).join('')}${x.need.map(t=>`<div style="color:var(--bad)">✗ ${esc(t)}</div>`).join('')}
      ${r.at?`<div><b>Made at:</b> ${r.at.map(st=>`${esc((REC.stations[st]||[st])[0])}${x.at.includes(st)?'':' <span class="muted">(not unlocked yet)</span>'}`).join(' · ')}</div>`:''}
      ${D.inv && r.k!=='build'?`<div>${(()=>{ const [b,c]=haveOf(r.id); return b+c ? `You already have ${num(b+c)} (${num(b)} on you, ${num(c)} in base chests).` : 'You don’t have any right now.'; })()}</div>`:''}
      ${used.length?`<div><b>Used to make:</b> ${used.map(u=>`<button type="button" class="btn ghost" style="min-height:30px;padding:0 4px" data-recq="${esc(u.n)}">${esc(u.n)}</button>`).join(' ')}</div>`:''}
    </div>`:''}
  </div>`;
}
function renderRecipes(){
  if (!REC){
    $('#view').innerHTML = `<div><h2>Recipes</h2><p class="sub">Loading every recipe in the game…</p></div>`;
    fetch('recipes.json').then(r=>r.json()).then(j=>{ REC=j; if (location.hash==='#recipes') renderRecipes(); })
      .catch(()=>{ if (location.hash==='#recipes') $('#view').innerHTML = `<div><h2>Recipes</h2><p class="sub">Couldn’t load the recipe list. Check your connection and open this tab again.</p></div>`; });
    return;
  }
  if (!D.tech){ $('#view').innerHTML = `<div><h2>Recipes</h2><p class="sub">This planner was built before recipes were tracked. ${askOwner()} to click Refresh now.</p></div>`; return; }
  if (!recCache || recCache.key!==D.player+'|'+D.saved) recBuild();
  const q = ui.recQ.trim().toLowerCase();
  const inCat = (x)=> ui.recCat==='all' || x.r.k===ui.recCat;
  const pool = recCache.list.filter(inCat);
  const nOk = pool.filter(x=>x.ok).length;
  let list = pool.filter(x=> ui.recStatus==='have' ? x.ok : !x.ok);
  if (q){
    // search everything (both unlocked and locked) by item name or material name
    const hit = (x)=> x.r.n.toLowerCase().includes(q) ? 2 : (x.r.m.some(([m])=>recItem(m).toLowerCase().includes(q)) ? 1 : 0);
    list = pool.map(x=>[x, hit(x)]).filter(([,h])=>h).sort((a,b)=>(b[1]-a[1]) || (b[0].ok-a[0].ok) || a[0].r.n.localeCompare(b[0].r.n)).map(([x])=>x);
  }
  const az = q ? {bar:'', list} : azPick('rec:'+ui.recCat+':'+ui.recStatus, list, x=>x.r.n);
  const shown = az.list;
  const counts = {}; recCache.list.forEach(x=>{ if (ui.recStatus==='have' ? x.ok : !x.ok){ counts[x.r.k]=(counts[x.r.k]||0)+1; counts.all=(counts.all||0)+1; } });
  const tp = D.tech || {};
  $('#view').innerHTML = `<div><h2>Recipes</h2><p class="sub">Every recipe you’ve unlocked, from the ${esc(D.saved)} save. It grows as you unlock Technologies and find schematics. “Have” counts what’s on you plus your guild’s base chests.</p></div>
    <div class="card"><div class="head"><div><h3>You’ve unlocked ${num(nOk)} of ${num(pool.length)} recipes</h3><p class="sub">${num(tp.p||0)} Technology point${tp.p===1?'':'s'} and ${num(tp.a||0)} Ancient Technology point${tp.a===1?'':'s'} left to spend.</p></div><div class="rating">${Math.round(nOk/Math.max(pool.length,1)*100)}%<small>unlocked</small></div></div><div class="prog"><i style="width:${Math.round(nOk/Math.max(pool.length,1)*100)}%"></i></div></div>
    <div class="row"><input type="search" id="recq" value="${esc(ui.recQ)}" placeholder="Search an item or a material, e.g. Pal Sphere or Ingot" aria-label="Search recipes" style="flex:1 1 240px">${q?'<button class="btn" id="recclear" type="button">Clear</button>':''}</div>
    ${q?'':`<div class="chips" role="group" aria-label="Show"><button type="button" class="chip" data-rst="have" aria-pressed="${ui.recStatus==='have'}">Unlocked</button><button type="button" class="chip" data-rst="locked" aria-pressed="${ui.recStatus==='locked'}">Still locked</button></div>
    <div class="chips" role="group" aria-label="Kind">${REC_CATS.filter(([k])=>counts[k]||k===ui.recCat).map(([k,l])=>`<button type="button" class="chip" data-rcat="${k}" aria-pressed="${ui.recCat===k}">${l} <span class="n">${counts[k]||0}</span></button>`).join('')}</div>`}
    ${az.bar}
    <div class="card">${q?`<p class="sub" style="margin:0">${list.length} match${list.length===1?'':'es'} for “${esc(ui.recQ.trim())}”${list.length>1?' (the item itself first, then things made with it)':''}</p>`:''}
      <div>${shown.slice(0, ui.recShown).map(recRow).join('') || `<div class="empty">${q?'Nothing matches that search.':(ui.recStatus==='have'?'Nothing unlocked here yet.':'You’ve unlocked everything here.')}</div>`}</div>
      ${shown.length>ui.recShown?`<button class="btn" id="recmore" type="button">Show more (${shown.length-ui.recShown} left)</button>`:''}
    </div>
    <p class="foot">Recipes, stations and unlocks come from the Palworld 1.0.5 game tables (Palworld Atlas Data, MIT; Arkive by Yihao Liu, CC BY-NC 4.0). Item and pal pictures are the game’s artwork (© Pocketpair) shown from PalWaypoint. “Have” is from the last save, so it can be up to 30 minutes old.</p>`;
  const rerender = ()=>{ const y=window.scrollY; renderRecipes(); window.scrollTo(0,y); };
  document.querySelectorAll('[data-rst]').forEach(b=>b.addEventListener('click', ()=>{ ui.recStatus=b.dataset.rst; ui.recShown=30; renderRecipes(); }));
  document.querySelectorAll('[data-rcat]').forEach(b=>b.addEventListener('click', ()=>{ ui.recCat=b.dataset.rcat; ui.recShown=30; renderRecipes(); }));
  wireAz(()=>{ ui.recShown=30; renderRecipes(); });
  document.querySelectorAll('[data-recopen]').forEach(b=>b.addEventListener('click', ()=>{ ui.recOpen = ui.recOpen===b.dataset.recopen ? null : b.dataset.recopen; rerender(); }));
  document.querySelectorAll('[data-recq]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); ui.recQ=b.dataset.recq; ui.recShown=30; ui.recOpen=null; renderRecipes(); window.scrollTo(0,0); }));
  const rq=$('#recq'); rq.addEventListener('input', (e)=>{ ui.recQ=e.target.value; ui.recShown=30; const pos=e.target.selectionStart; renderRecipes(); const n=$('#recq'); n.focus(); n.setSelectionRange(pos,pos); });
  const rc=$('#recclear'); if (rc) rc.addEventListener('click', ()=>{ ui.recQ=''; ui.recShown=30; renderRecipes(); });
  const more=$('#recmore'); if (more) more.addEventListener('click', ()=>{ ui.recShown+=30; rerender(); });
}

// ---------- Breeding ----------
function renderBreeding(){
  const B = D.breeding || {};
  if (!B.plan){ $('#view').innerHTML = `<div><h2>Breeding planner</h2><p class="sub">This planner was built before the new breeding plan. ${askOwner()} to click Refresh now.</p></div>`; return; }
  const ST = {have:['have','Your best one has it'], kind:['kind','Another one of yours has it'], carrier:['carrier','A different pal of yours has it'], none:['none','None of your pals has it yet']};
  const chips = (list)=>`<div class="chips">${(list||[]).map(x=>`<span class="pchip ${ST[x.state][0]}" title="${esc(ST[x.state][1]+(x.d?' · '+x.d:''))}">${esc(x.n)}</span>`).join('')}</div>`;
  const legend = `<div class="row" style="gap:10px;font-size:11px;color:var(--muted)"><span class="pchip have">On your best one</span><span class="pchip kind">On another of that kind</span><span class="pchip carrier">On a different pal</span><span class="pchip none">Nobody has it yet</span></div>`;
  const statusBadge = (s)=>`<span class="badge ${s==='Close'||s==='Done'?'gold':''}">${esc(s)}</span>`;
  const palRow = (i)=>{ const p=PALS[i]; if(!p) return ''; return `<div class="pal mini">${palAvatar(p,28)}<div class="t"><div class="nm">${palTitle(p)}<span class="muted" style="font-weight:400">${genderSym(p.gender)} · Lv ${p.lv}</span></div><div class="ln">${esc(p.loc)}</div></div></div>`; };
  const stepList = (steps)=>`<ol class="steps">${(steps||[]).map(s=>`<li class="${esc(s.kind)}"><span>${esc(s.text)}</span>${(s.parents||[]).length?`<div class="parents">${s.parents.map(palRow).join('')}</div>`:''}${s.find&&s.find.length?whereBlock(s.find):''}</li>`).join('')}</ol>`;

  const plan = B.plan.map((pr,k)=>`<div class="card">
      <div class="head"><span class="kicker">${k+1} · ${esc(pr.role)}</span>${statusBadge(pr.status)}</div>
      <div><h3 style="font-family:var(--font-display);font-size:18px">${esc(pr.title)}</h3><p class="meta" style="margin:4px 0 0">${esc(pr.why)}</p></div>
      <div><div class="kicker" style="margin-bottom:4px">Aim for these passives</div>${chips(pr.ideal)}</div>
      ${stepList(pr.steps)}
    </div>`).join('') || '<div class="empty">Nothing to breed right now. Check the goals below.</div>';

  const pairs = (B.pairs||[]).map(x=>`<div class="card">
      <div class="head"><div class="pal">${nameAvatar(x.child, x.els||[], 40)}<h3 style="font-family:var(--font-display);font-size:17px">${esc(x.child)}</h3></div><span class="badge gold">New for you</span></div>
      <div class="parents">${x.parents.map(palRow).join('<div class="plus" aria-hidden="true">+</div>')}</div>
      <p class="meta" style="margin:0">${esc(x.why)}</p><p class="meta" style="margin:0;color:var(--muted)">${esc(x.note)}</p></div>`).join('');

  const groups = {}; (B.goals||[]).forEach(g=>{ (groups[g.group] ||= []).push(g); });
  const goalRow = (g)=>`<div class="goal ${g.interim?'interim':''}">
      <div class="head"><div class="pal" style="align-items:flex-start">${nameAvatar(g.name, g.els, 32)}<div class="t"><div class="nm">${g.interim?'<span class="muted" style="font-weight:600">For now: </span>':''}${esc(g.name)} <span class="muted" style="font-weight:500">${esc(g.job?g.job+' Lv '+g.lv:(g.els||[]).join('/'))}</span></div>
      <div class="ln" style="white-space:normal">${esc(g.why)}</div></div></div>${statusBadge(g.status)}</div>
      ${chips(g.idealView)}
      <div class="meta" style="font-size:12px">${esc(g.how)}${g.nowName?` <span class="muted">· Best you can get now: ${esc(g.nowName)}</span>`:''}</div>
      ${g.find&&g.find.length?whereBlock(g.find):''}
    </div>`;
  const goals = Object.entries(groups).map(([name,list])=>`<div class="card"><h3>${esc(name)}</h3>${list.map(goalRow).join('')}</div>`).join('');

  const avoid = (B.avoid||[]).map(a=>`<div class="card"><h3>${esc(a.title)}</h3><p class="meta" style="margin:0">${esc(a.text)}</p></div>`).join('');
  const keep = (B.keep||[]).map(i=>{ const p=PALS[i]; return `<div style="border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px"><div class="pal">${palAvatar(p,32)}<div class="t"><div class="nm">${palTitle(p)} <span class="muted" style="font-weight:400">Lv ${p.lv}${genderSym(p.gender)}</span></div><div class="ln">${statLine(p)} · ${esc(p.loc)}</div></div></div><div class="chips">${passiveChips(p)}</div></div>`; }).join('');
  const acc = B.access || {};
  const reach = [acc.tree===false?'the World Tree (catch Panthalus first)':'', acc.sky===false?'Sunreach (beat the Feybreak Tower first)':''].filter(Boolean);

  $('#view').innerHTML = `<div><h2>Breeding planner</h2><p class="sub">Built only from your ${PALS.length} pals${reach.length?`. Not open for you yet: ${esc(reach.join(' and '))}, so pals from there are marked Later.`:'.'}</p></div>
    <details class="card"><summary><h3 style="display:inline">How breeding works in 1.0</h3> <span class="muted" style="font-size:12px">tap to open</span></summary>
      <ul class="rules">
        <li><b>Same pair, same baby.</b> Two kinds of pals always make the same kind of baby. Special pairs always win (Menasting + Knocklem always makes Menasting Terra). One pair depends on the parents’ genders: a male Katress with a female Wixen makes Wixen Noct, and a female Katress with a male Wixen makes Katress Ignis. Some pals come only from one special pair, and legendaries only from two of their own kind.</li>
        <li><b>Passives:</b> a baby gets 1, 2, 3 or 4 passives (40%, 30%, 20%, 10% of the time), picked from everything the two parents carry together. So every extra passive on the parents lowers the odds. If the parents carry exactly the 4 you want, about 1 egg in 10 gets all 4. With 5 different passives it drops to about 1 in 50, and with 6 to about 1 in 150.</li>
        <li><b>True values:</b> each of HP, Attack and Defense comes from the father (about 30%), the mother (about 30%) or is random (about 40%). Use high-value parents.</li>
        <li><b>Cakes</b> (what the game says each one does): Cake: a normal egg · Mushroom Cake (Technology 30): true values grow a little more easily · Vegetable Cake (Technology 47): two eggs at once · Extravagant Vegetable Cake (Technology 60): mutations more likely and true values grow more easily · Special Cake (Technology 74): more likely to pass on several passives.</li>
        <li><b>Mutations:</b> a rare egg with top true values, extra rainbow passives and sometimes a mutation-only passive like Babysitter. Players report roughly 1 in 100 to 1 in 200 normally, and much more often with the Extravagant Vegetable Cake.</li>
        ${eggLine()}
      </ul>
      <p class="meta" style="margin:0;color:var(--muted)">These odds were measured by players. Pocketpair hasn't published exact numbers.</p></details>
    <div><h3>Your breeding plan</h3><p class="sub">Most useful first. Each step names the exact pals to use.</p></div>
    ${legend}
    ${plan}
    ${pairs?`<div><h3>New pals you can make right now</h3><p class="sub">Pairs from pals you own that make a kind you don't have yet.</p></div>${pairs}`:''}
    <div><h3>End-game goals</h3><p class="sub">The best pals in the game and the passives to aim for. Later = not open for you yet.</p></div>
    ${goals}
    ${avoid?`<div><h3>Don't waste Cake on</h3></div>${avoid}`:''}
    <div class="card"><h3>Your best parents</h3><p class="sub" style="margin-top:-6px">Keep these. They have strong passives or true values to pass on.</p>${keep}</div>
    <a href="#crews" class="card blue" style="text-decoration:none;color:inherit"><span class="meta"><b style="color:var(--blue)">Running low on Cake?</b> See the Cake supply crew in the Crews tab.</span></a>`;
  const link = document.querySelector('a.card.blue'); if (link) link.addEventListener('click', ()=>{ ui.job='cake'; });
}

// ---------- Voice (the family's Discord voice channel) ----------
let VOICE = null, voiceTimer = null;
async function pollVoice(){
  if (location.hash!=='#voice'){ clearInterval(voiceTimer); voiceTimer = null; return; }
  if (document.hidden) return;
  try {
    const r = await fetch('voice', {headers:{'X-Planner-Code':UNLOCK_CODE}, cache:'no-store'});
    VOICE = r.ok ? await r.json() : {configured:false, offline:true};
  } catch(e){ if (!VOICE) VOICE = {configured:false, offline:true}; }
  if (location.hash==='#voice') paintVoice();
}
function renderVoice(){
  if (!voiceTimer){ pollVoice(); voiceTimer = setInterval(pollVoice, 20000); }
  paintVoice();
}
function paintVoice(){
  const v = VOICE;
  const head = `<div><h2>Voice</h2><p class="sub">Talk while you play, in our Discord voice channel. It works from your phone, or straight from a PS5 or Xbox.</p></div>`;
  if (!v){ $('#view').innerHTML = head + `<div class="empty">Checking the voice channel…</div>`; return; }
  if (!v.configured){
    $('#view').innerHTML = head + `<div class="card"><b>Voice isn’t set up yet</b><p class="meta" style="margin:0">${v.offline ? 'The server PC didn’t answer. Try again in a minute.' : askOwner() + ' to pick the voice channel in the server’s control panel (Discord tab).'}</p></div>`;
    return;
  }
  let who;
  if (v.widget==='ok' && Array.isArray(v.inVoice)){
    who = v.inVoice.length
      ? `<div class="chips">${v.inVoice.map(n=>`<span class="chip" style="cursor:default"><span class="dot-on" aria-hidden="true"></span>${esc(n)}</span>`).join('')}</div>`
      : `<p class="meta" style="margin:0">Nobody’s in voice right now. Be the first.</p>`;
  } else if (v.widget==='ok' && v.private){
    who = `<p class="meta" style="margin:0">This channel is private, so Discord doesn’t share who’s in it.</p>`;
  } else if (v.widget==='off'){
    who = `<p class="meta" style="margin:0">Names show up here once the Discord server widget is turned on (Server Settings › Widget › Enable Server Widget).</p>`;
  } else {
    who = `<p class="meta" style="margin:0">Couldn’t check Discord just now.</p>`;
  }
  $('#view').innerHTML = head + `
    <div class="card gold">
      <div class="kicker">${esc(v.server||'Discord')}</div>
      <h3 style="margin:0;font-size:20px">${esc(v.channel||'Voice')}</h3>
      <a class="btn primary" href="${esc(v.joinUrl)}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:52px;font-size:17px">Join voice</a>
      <p class="meta" style="margin:0">Opens Discord on the voice channel. Tap <b>Join Voice</b> there. To talk through your console instead, tap <b>Join on PlayStation</b> or <b>Join on Xbox</b> in that screen.</p>
      <p class="meta" style="margin:0">Discord app didn’t open? <a href="${esc(v.appUrl)}" style="color:var(--accent)">Try this link</a>.</p>
      <p class="meta" style="margin:0">Join voice only works once you’re in our Discord server. ${v.invite?`Not in it yet? <a href="${esc(v.invite)}" target="_blank" rel="noopener" style="color:var(--accent)">Join the server first</a>, then come back and tap Join voice.`:'Not in it yet? Ask the server owner for an invite.'}</p>
    </div>
    <div class="card"><div class="kicker">In voice now</div>${who}</div>
    <details class="card"><summary><b>Join from a PS5 or Xbox, no phone needed</b></summary>
      <p class="meta" style="margin:0"><b>First, once:</b> link your console account in the Discord app (Settings › Connections › add PlayStation Network or Xbox).</p>
      <p class="meta" style="margin:0"><b>PS5:</b> press the PS button for the Control Center › Game Base › Discord › pick <b>${esc(v.channel||'the voice channel')}</b> › Join.</p>
      <p class="meta" style="margin:0"><b>Xbox:</b> press the Xbox button for the Guide › Parties &amp; chats › Discord › pick the server and <b>${esc(v.channel||'the voice channel')}</b>.</p>
    </details>
`;
}
let UNLOCK_CODE = '', liveLayer = null, liveTimer = null, liveOff = false;
// Live positions: everyone online right now, from the server (through the Command Center on the server PC).
async function pollLive(){
  if (!map || mapRegion!=='main' || liveOff || document.hidden || location.hash!=='#map') return;
  let j; try { const r = await fetch('live', {headers:{'X-Planner-Code':UNLOCK_CODE}, cache:'no-store'}); if (r.status===403 || r.status===404){ liveOff = true; paintLive(null); return; } j = await r.json(); } catch(e){ return; }
  paintLive(j);
}
function paintLive(j){
  const box = $('#live'); if (!box) return;
  if (liveLayer){ liveLayer.remove(); liveLayer = null; }
  if (!j || j.cc===false){ box.innerHTML = '<span class="meta">Live positions show here when the server’s Command Center is running.</span>'; return; }
  const ps = j.players||[];
  if (!ps.length){ box.innerHTML = `<span class="meta">${j.state==='off'?'The server is off.':'Nobody is online right now.'}</span>`; return; }
  liveLayer = L.layerGroup();
  for (const p of ps){
    const m = L.circleMarker([p.gy,p.gx],{radius:8,color:'#0b1220',weight:2,fillColor:'#6ea8ff',fillOpacity:1});
    m.bindTooltip(esc(p.name), {permanent:true, direction:'top', offset:[0,-8], className:'live-label'});
    m.on('click',()=>selectSpot(p.name,'Online now',p.gx,p.gy,'Lv '+p.level));
    liveLayer.addLayer(m);
  }
  liveLayer.addTo(map);
  box.innerHTML = `<span class="kicker">Online now</span><div class="chips">${ps.map((p,i)=>`<button class="chip" type="button" data-live="${i}"><span class="dot" style="background:#6ea8ff"></span>${esc(p.name)} <span class="n">Lv ${esc(p.level)}</span></button>`).join('')}</div>`;
  box.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{ const p=ps[+b.dataset.live]; map.setView([p.gy,p.gx], .5); selectSpot(p.name,'Online now',p.gx,p.gy,'Lv '+p.level); }));
}
const catLayers={}; const mapSel=new Set(['tower','watch']);
const zs = ()=>{ if(!map) return 1; const z=map.getZoom(); return z<-1.75?0.55:z<-1?0.7:z<-0.25?0.85:z<0.75?1:1.25; };
const done = (cat,p)=> (D.progress[cat]||[]).includes(p[4]);
function glowFor(p, base){ const g=L.circleMarker([p[1],p[0]],{renderer,radius:base*2.4*zs(),color:'#f5c04e',weight:2,opacity:glowOn?.95:0,fillColor:'#f5c04e',fillOpacity:glowOn?.32:0,interactive:false}); g._base=base*2.4; g._glow=true; return g; }
function selectSpot(title, kicker, gx, gy, info){
  if (selRing) selRing.remove();
  selRing = L.circleMarker([gy,gx],{renderer,radius:13,color:'#fff',weight:3,fill:false,interactive:false}).addTo(map);
  $('#spot').innerHTML = `<span class="kicker">${esc(kicker)}</span><span style="font-family:var(--font-display);font-size:18px;font-weight:700">${esc(title)}</span><span class="meta">Coordinates <b style="color:var(--accent)">(${fmt(gx)}, ${fmt(gy)})</b></span>${info?`<span class="meta">${esc(info)}</span>`:''}<span class="meta">Nearest fast travel: <b>${esc(nearestFT(gx,gy))}</b></span>`;
  $('#spot').classList.add('gold');
}
function buildCat(id){
  const c=CATS.find(x=>x.id===id); const g=L.layerGroup();
  for (const p of REG().pts[id]||[]){
    const base = id==='tower'?9:(id==='alpha'?7:5.5);
    const isDone = c.prog && done(id,p);
    if (GLOW.has(id) && p[4] && !isDone) g.addLayer(glowFor(p, base));
    const m=L.circleMarker([p[1],p[0]],{renderer,radius:base*zs(),color:'#0b1220',weight:1.25,fillColor:c.color,fillOpacity: c.prog && isDone ? .45 : .95}); m._base=base;
    const reward = id==='ruin' && SCH && SCH.ruins ? SCH.ruins[p[4]] : '';
    m.bindTooltip(esc(p[2])+(reward?': '+esc(reward):'')+(c.prog?(isDone?' · done':' · not done yet'):''),{direction:'top',offset:[0,-6]});
    m.on('click',()=>selectSpot(p[2], c.label, p[0], p[1], [reward?'Reward: '+reward:p[3], c.prog?(isDone?'You’ve done this one':'You haven’t done this one yet'):''].filter(Boolean).join(' · ')));
    g.addLayer(m);
  }
  return g;
}
function setCat(id,on){ if(on){ mapSel.add(id); if(!catLayers[id]) catLayers[id]=buildCat(id); catLayers[id].addTo(map);} else { mapSel.delete(id); if(catLayers[id]) catLayers[id].remove(); } const b=document.querySelector(`[data-cat="${id}"]`); if(b) b.setAttribute('aria-pressed',on?'true':'false'); }
function renderMap(){
  if (mapFocus && mapFocus.map) mapRegion = mapFocus.map;
  const R = REG();
  const prog = [['ft','Fast travel points'],['watch','Watchtowers'],['tower','Boss towers'],['alpha','Alpha pals beaten'],['ruin','Ruin towers'],['effigy','Effigies'],['journal','Journals']].map(([id,l])=>{ const all=(R.pts[id]||[]).filter(p=>p[4]); if(!all.length) return ''; const n=all.filter(p=>done(id,p)).length; return `<div class="kv"><span>${l}</span><span><b style="color:var(--accent)">${all.length-n}</b> of ${all.length} left</span></div>`; }).join('');
  const groups={}; CATS.filter(c=>(R.pts[c.id]||[]).length).forEach(c=>{ (groups[c.group] ||= []).push(c); });
  const sub = mapRegion==='tree'
    ? 'The World Tree. Bright green paths are where pals roam; the dark areas are cliffs and giant roots. Gold glow = what you haven’t unlocked yet.'
    : 'Main islands, drawn from the game’s own data. Gold glow = waypoints, towers and watchtowers you haven’t unlocked yet.';
  $('#view').innerHTML = `<div><h2>World map</h2><p class="sub">${sub}</p></div>
    <div class="chips" role="group" aria-label="Which map">${['main','tree'].map(r=>`<button class="chip" type="button" data-region="${r}" aria-pressed="${mapRegion===r}">${RNAME[r]}</button>`).join('')}</div>
    <div id="map" role="application" aria-label="Map of the ${esc(RNAME[mapRegion])}"></div>
    ${mapRegion==='main'?'<div class="card" id="live"><span class="meta">Checking who’s online…</span></div>':''}
    <div class="card" id="spot"><span class="meta">Tap any pin to see its coordinates and the nearest fast travel point.</span></div>
    <div class="row"><label class="small" for="mpal" style="flex-basis:100%">Find a pal</label><input type="search" id="mpal" list="mpal-list" placeholder="${mapRegion==='tree'?'e.g. Mycora':'e.g. Digtoise'}" style="flex:1 1 200px"><datalist id="mpal-list">${[...new Set(Object.keys(R.pals||{}).concat((R.pts.alpha||[]).map(p=>p[2].replace('Alpha ',''))))].sort().map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist><button class="btn primary" id="mpal-go" type="button">Show</button><button class="btn" id="mpal-clear" type="button" hidden>Clear</button></div>
    <div id="mpal-res"></div>
    <div class="card"><div class="head"><h3>Still to unlock</h3><span class="tag">${esc(RNAME[mapRegion])} · from your save</span></div>${prog||'<div class="meta">Nothing to track here.</div>'}
      <div class="chips"><button class="chip" type="button" id="glow" aria-pressed="${glowOn}"><span class="dot" style="background:#f5c04e"></span>Glow what I still need</button><button class="chip" type="button" id="ftbtn" aria-pressed="true"><span class="dot" style="background:#fff"></span>Fast travel points</button></div></div>
    <div><div class="row" style="justify-content:space-between"><h3>Show on map</h3><button class="btn ghost" id="mclear" type="button">Clear all</button></div><p class="sub">Tap one or more. Only what you pick shows on the map.</p>
      ${Object.entries(groups).map(([g,list])=>`<div class="group"><h4>${esc(g)}</h4><div class="chips">${list.map(c=>`<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${mapSel.has(c.id)}"><span class="dot" style="background:${c.color}"></span>${esc(c.label)} <span class="n">${(R.pts[c.id]||[]).length}</span></button>`).join('')}</div></div>`).join('')}</div>
    <p class="foot">Pins use in-game coordinates from the game's own files, so they match your in-game map. Location data: Palworld Atlas Data (MIT), PalDex (MIT), Palworld Save Pal (GPL-3.0), Arkive by Yihao Liu (CC BY-NC 4.0, non-commercial use, modified). Terrain heights: Palworld Save Pal (GPL-3.0). Palworld and its game data belong to Pocketpair. Unofficial family fan tool.</p>`;
  if (map){ map.remove(); map=null; }
  for (const k in catLayers) delete catLayers[k]; ftLayer=null; palLayer=null; selRing=null;
  renderer=L.canvas({padding:.5});
  map=L.map('map',{crs:L.CRS.Simple,preferCanvas:true,zoomSnap:.25,zoomDelta:.5,minZoom:-3,maxZoom:2,attributionControl:false});
  const b=L.latLngBounds(R.bounds);
  L.imageOverlay(RIMG[mapRegion],b,{interactive:false}).addTo(map);
  map.fitBounds(b); map.setMaxBounds(b.pad(.2)); map.setMinZoom(map.getZoom()-.5);
  const ro=L.control({position:'bottomleft'}); ro.onAdd=()=>{ const d=L.DomUtil.create('div','readout'); d.id='ro'; d.textContent='Tap for coordinates'; return d; }; ro.addTo(map);
  map.on('mousemove click',(e)=>{ const r=$('#ro'); if(r) r.textContent=`X ${fmt(e.latlng.lng)}, Y ${fmt(e.latlng.lat)}`; });
  ftLayer=L.layerGroup();
  for (const p of (R.pts.ft||[])){ const isDone=done('ft',p); if(!isDone) ftLayer.addLayer(glowFor(p,4)); const m=L.circleMarker([p[1],p[0]],{renderer,radius:4*zs(),color:'#0b1220',weight:1.25,fillColor:'#fff',fillOpacity:isDone?.5:1}); m._base=4; m.bindTooltip(esc(p[2]),{permanent:true,direction:'right',offset:[4,0],className:'ft-label'}); m.on('click',()=>selectSpot(p[2],'Fast travel point',p[0],p[1],isDone?'Unlocked':'Not unlocked yet')); ftLayer.addLayer(m); }
  ftLayer.addTo(map);
  const onZoom=()=>{ const z=map.getZoom(), c=map.getContainer(); c.classList.toggle('hide-labels', z<-.75); const k=zs(); const rs=(g)=>{ if(g) g.eachLayer(m=>{ if(m._base) m.setRadius(m._base*k); }); }; Object.values(catLayers).forEach(rs); rs(ftLayer); rs(palLayer); };
  map.on('zoomend',onZoom);
  [...mapSel].filter(id=>(R.pts[id]||[]).length).forEach(id=>setCat(id,true)); onZoom();
  setTimeout(()=>map.invalidateSize(),50);
  liveLayer = null; clearInterval(liveTimer);
  if (mapRegion==='main'){ pollLive(); liveTimer = setInterval(pollLive, 20000); }
  document.querySelectorAll('[data-region]').forEach(btn=>btn.addEventListener('click',()=>{ if(btn.dataset.region!==mapRegion){ mapRegion=btn.dataset.region; renderMap(); } }));
  document.querySelectorAll('[data-cat]').forEach(btn=>btn.addEventListener('click',()=>setCat(btn.dataset.cat, btn.getAttribute('aria-pressed')!=='true')));
  $('#mclear').addEventListener('click',()=>{ [...mapSel].forEach(id=>setCat(id,false)); });
  $('#glow').addEventListener('click',(e)=>{ glowOn=e.currentTarget.getAttribute('aria-pressed')!=='true'; e.currentTarget.setAttribute('aria-pressed',glowOn); const ap=(g)=>{ if(g) g.eachLayer(m=>{ if(m._glow) m.setStyle({opacity:glowOn?.95:0,fillOpacity:glowOn?.32:0}); }); }; Object.values(catLayers).forEach(ap); ap(ftLayer); });
  $('#ftbtn').addEventListener('click',(e)=>{ const on=e.currentTarget.getAttribute('aria-pressed')!=='true'; e.currentTarget.setAttribute('aria-pressed',on); on?ftLayer.addTo(map):ftLayer.remove(); });
  const showPal=()=>{
    const q=$('#mpal').value.trim().toLowerCase(); if(!q) return false;
    const names=[...new Set(Object.keys(R.pals||{}).concat((R.pts.alpha||[]).map(p=>p[2].replace('Alpha ',''))))];
    const name=names.find(k=>k.toLowerCase()===q)||names.find(k=>k.toLowerCase().startsWith(q));
    if(palLayer) palLayer.remove(); palLayer=null;
    if(!name){
      const other = mapRegion==='tree'?'main':'tree';
      const elsewhere = whereToCatch(Object.keys(REG(other).pals||{}).find(k=>k.toLowerCase()===q||k.toLowerCase().startsWith(q))||'').filter(w=>w.map===other);
      $('#mpal-res').innerHTML = elsewhere.length
        ? `<div class="card"><span class="meta">${esc(elsewhere[0].pal)} doesn’t live on the ${esc(RNAME[mapRegion])}. It’s on the ${esc(RNAME[other])}:</span>${whereBlock(elsewhere)}</div>`
        : `<div class="card"><span class="meta">No wild spawns found for that name on the ${esc(RNAME[mapRegion])}.</span></div>`;
      return false;
    }
    $('#mpal').value=name; const cells=(R.pals||{})[name]||[]; palLayer=L.layerGroup(); const AV=['day and night','daytime only','night only'], AC=['#3fd0c9','#b8f3ee','#a493ff'];
    for(const c of cells){ const base=Math.min(10,3+Math.sqrt(c[5])*1.2); const m=L.circleMarker([c[1],c[0]],{renderer,radius:base*zs(),color:'#0b1220',weight:1,fillColor:AC[c[4]],fillOpacity:.85}); m._base=base; m.on('click',()=>selectSpot(name,'Wild spawn area',c[0],c[1],`Lv ${c[2]}–${c[3]} · ${AV[c[4]]}`)); palLayer.addLayer(m); }
    const alphas=(R.pts.alpha||[]).filter(p=>p[2]==='Alpha '+name);
    for(const p of alphas){ const m=L.circleMarker([p[1],p[0]],{renderer,radius:9*zs(),color:'#0b1220',weight:2,fillColor:'#ff7a45',fillOpacity:1}); m._base=9; m.on('click',()=>selectSpot(p[2],'Alpha pal',p[0],p[1],p[3])); palLayer.addLayer(m); }
    palLayer.addTo(map);
    const pts=cells.map(c=>[c[1],c[0]]).concat(alphas.map(p=>[p[1],p[0]]));
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(.25),{maxZoom:0});
    const mine = PALS.filter(p=>p.name===name).length;
    $('#mpal-res').innerHTML=`<div class="card gold"><span class="kicker">${cells.length?'Wild spawns':'Alpha only'} · ${esc(RNAME[mapRegion])}</span><span style="font-family:var(--font-display);font-size:18px;font-weight:700">${esc(name)}</span><span class="meta">You own ${mine}. ${alphas.length?'Alpha: '+alphas.map(a=>`(${fmt(a[0])}, ${fmt(a[1])}) ${esc(a[3])}`).join('; '):'No alpha version here.'}</span>${whereBlock(whereToCatch(name).filter(w=>w.kind==='Wild'&&w.map===mapRegion))}</div>`;
    $('#mpal-clear').hidden=false;
    return true;
  };
  $('#mpal-go').addEventListener('click',showPal);
  $('#mpal').addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); showPal(); } });
  $('#mpal-clear').addEventListener('click',()=>{ if(palLayer) palLayer.remove(); palLayer=null; $('#mpal').value=''; $('#mpal-res').innerHTML=''; $('#mpal-clear').hidden=true; });
  if (mapFocus){
    const f=mapFocus; mapFocus=null;
    if (f.pal){ $('#mpal').value=f.pal; showPal(); }
    if (isFinite(f.gx) && isFinite(f.gy)){
      let info = '';
      if (f.label==='Ancient ruin tower'){ const r=(R.pts.ruin||[]).find(p=>Math.abs(p[0]-f.gx)<2&&Math.abs(p[1]-f.gy)<2); if (r) info=[SCH&&SCH.ruins&&SCH.ruins[r[4]]?'Reward: '+SCH.ruins[r[4]]:'', done('ruin',r)?'You’ve done this one':'You haven’t done this one yet'].filter(Boolean).join(' · '); }
      map.setView([f.gy,f.gx], 0.25); selectSpot(f.pal||f.label||'Here', f.pal?'Where to catch':'Location', f.gx, f.gy, info);
    }
  }
}

// ---------- boot ----------
(async function boot(){
  fetch('schematics.json').then(r=>r.json()).then(j=>{ SCH=j; if (D && location.hash==='#schem') renderSchem(); }).catch(()=>{});
  try { MAPD = await (await fetch('mapdata.json')).json(); } catch(e){ MAPD = {pts:{ft:[],alpha:[]},pals:{},bounds:[[0,0],[1,1]]}; }
  const saved = store.get('vega-code');
  if (saved){ $('#code').value = saved; try { if (await tryUnlock(saved)) { start(); return; } } catch(e){} }
  $('#code').focus();
})();
})();
</script>
